<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lap5 menu</title>

    <style>
 /*  menu ngang */
.menu_ngang {
    display: flex;
    list-style: none;
    padding: 0;
 }
 .menu_ngang li{
    margin: 0;
    padding: 10px;
    background-color:aquamarine;
 }
 .menu_ngang li a{
    text-decoration: none;
 }
 .menu_ngang li a:hover{
    color:rgb(255, 255, 255);
    font-weight: bold;
 }
.menu_ngang li:hover{
    background-color:rgb(255, 153, 80);
    border-radius: 5px;
}

/* menu doc */
 .menu_doc{
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    width: 100px;
 }
 .menu_doc li:hover{
    
    font-style: italic;
    filter: brightness(130%);
 }
 .menu_doc li{
    background-color: rgb(0, 123, 172);
    margin: 0;
    padding: 10px;
    border-bottom: white solid 1px;
 }
    </style>
  
</head>

<body>
    <div>
        <ul class="menu_ngang">
            <li><a href="#">Trang Chu</a></li>
            <li><a href="#">Gioi Thieu</a></li>
            <li><a href="#">San Pham</a></li>
            <li><a href="#">Dich Vu</a></li>
            <li><a href="#">Lien He</a></li>
        </ul>
    </div>

    <div>
        <ul class="menu_doc">
            <li>Trang Chu</li>
            <li>Gioi Thieu</li>
            <li>San Pham</li>
            <li>Dich Vu</li>
            <li>Lien He</li>
        </ul>
    </div>
    
</body>
</html>
